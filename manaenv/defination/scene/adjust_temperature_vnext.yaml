################################################################################
# adjust_temperature schema-vNext scene (from feature/staged-layer-funnel).
#
# Single turnable knob (knob_a). Reset also re-samples y in
# {-0.08, -0.45} via randomize_object_pose_from_list on the stage base so
# dual-arm EX001 can reach left vs right. The selected ID environment applies
# the shared -599 deg stop once at startup.
#
################################################################################

definition:
  scene_type: adjust_temperature_scene
  metadata:
    name: ex001_6r_adjust_temperature
    source: adjust_temperature/vnext
    semantic_goal: Adjust the knob from the sampled initial temperature to the target

render_settings:
  gen_method: 0
  tags: green_booth

background:
  id: booth
  asset:
    type: asset_id
    id: green_booth_mesh
  pose:
    position: [-0.452, -0.271, -0.985]
    # XYZW (Isaac Sim 6.0)
    orientation: [0.0, 0.0, -0.704, 0.709]
  required_surfaces:
  - tabletop

objects:
- id: knob_a
  asset:
    type: asset_id
    id: knob_a
  # XYZW: 180° about Z so the panel faces the robot (proven on Isaac 6.0).
  orientation: [0.0, 0.0, 1.0, 0.0]
  semantic_tags:
  - turnable

layout:
  surfaces:
    tabletop:
      type: ref
      ref: background.tabletop
  nodes:
    knob_a:
      object: knob_a
      placement:
        type: pose
        poses:
        - id: default
          position: [-0.07, -0.45, -0.18]
          orientation: [0.0, 0.0, 1.0, 0.0]
