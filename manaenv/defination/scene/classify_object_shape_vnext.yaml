definition:
  scene_type: classify_object_shape_scene
  metadata:
    name: ex001_6r_classify_object_shape_vnext
    source: classify_object_shape/vnext
    semantic_goal: Sort each rigid object into the basket matching its geometric shape
render_settings:
  gen_method: 0
  tags: green_booth
background:
  id: booth
  asset:
    type: asset_id
    id: green_booth_mesh
  pose:
    position:
    - -0.452
    - -0.271
    - -0.985
    orientation:
    - 0.0
    - 0.0
    - -0.704
    - 0.709
  required_surfaces:
  - tabletop
objects:
- id: shape_cube
  asset:
    type: pool
    cache_size: 10
    candidates:
    - id: cube
      from_file: assets/manipulation/cube.json
      item_range:
      - 0
      - 10
      scale_normalization:
        max_shortest_edge: 0.05
        max_longest_edge: 0.1
  spawn_mass:
  - 0.05
  - 0.15
  semantic_tags:
  - sortable
  - sortable_cube
- id: shape_cylinder
  asset:
    type: pool
    cache_size: 10
    candidates:
    - id: cylinder
      from_file: assets/manipulation/cylinder.json
      item_range:
      - 0
      - 10
      scale_normalization:
        max_shortest_edge: 0.05
        max_longest_edge: 0.1
  spawn_mass:
  - 0.05
  - 0.15
  semantic_tags:
  - sortable
  - sortable_cylinder
- id: shape_sphere
  asset:
    type: pool
    cache_size: 10
    candidates:
    - id: sphere
      from_file: assets/manipulation/ball.json
      item_range:
      - 0
      - 10
      scale_normalization:
        min_shortest_edge: 0.03
        max_shortest_edge: 0.05
  spawn_mass:
  - 0.05
  - 0.15
  semantic_tags:
  - sortable
  - sortable_sphere
- id: basket_c
  asset:
    type: asset_id
    id: basket_c
  semantic_tags:
  - destination
  - destination_cube
- id: basket_d
  asset:
    type: asset_id
    id: basket_d
  semantic_tags:
  - destination
  - destination_cylinder
- id: basket_e
  asset:
    type: asset_id
    id: basket_e
  semantic_tags:
  - destination
  - destination_sphere
layout:
  surfaces:
    tabletop:
      type: ref
      ref: background.tabletop
  nodes:
    shape_cube:
      object: shape_cube
    shape_cylinder:
      object: shape_cylinder
    shape_sphere:
      object: shape_sphere
    basket_c:
      object: basket_c
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: -0.12
          y: 0.34
        orientation:
        - 0.0
        - 0.0
        - -0.70711
        - 0.70711
    basket_d:
      object: basket_d
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: -0.12
          y: 0.02
        orientation:
        - 0.0
        - 0.0
        - -0.70711
        - 0.70711
    basket_e:
      object: basket_e
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: -0.12
          y: -0.3
        orientation:
        - 0.0
        - 0.0
        - -0.70711
        - 0.70711
  groups:
    sortable_start_region:
      type: region
      nodes:
      - shape_cube
      - shape_cylinder
      - shape_sphere
      surface: tabletop
      ranges:
        x:
        - 0.08
        - 0.28
        y:
        - -0.42
        - 0.42
      yaws:
      - -0.5
      - 0.5
      sample_method: stratified
      spacing_mode: footprint_gap
      min_spacing: 0.06
      jitter: 0.35
      max_attempts: 2000
variants:
  materialization:
  - id: cube_pick
    type: asset_pool_choice
    choices:
    - id: pick
      candidate_refs:
      - shape_cube.cube
  - id: cylinder_pick
    type: asset_pool_choice
    choices:
    - id: pick
      candidate_refs:
      - shape_cylinder.cylinder
  - id: sphere_pick
    type: asset_pool_choice
    choices:
    - id: pick
      candidate_refs:
      - shape_sphere.sphere
  assignments: []
