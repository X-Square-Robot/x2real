################################################################################
# move_bottle_to_bin schema-vNext scene (ID). Static migration from mobile_manip5.1.
# Per-episode bottle XY / robot start owned by task/operation_zones.yaml (P4 sampler).
################################################################################
definition:
  scene_type: move_bottle_to_bin_scene
  seed: 42
  nums: 1
  sim_fps: 240
  render_decremental: 8
  simulation_decimation: 4
  metadata:
    name: move_bottle_to_bin
    split: id
    semantic_goal: EX001 picks one sampled bottle from a table and places it in a bin.
render_settings:
  gen_method: 0
  tags: green_booth
background:
  id: booth
  asset:
    type: asset_id
    id: move_bottle_to_bin_green_booth
  # Standard AssetBasedComponent preload (not SceneGeneratorCFG).
  asset_module: manaenv.assets.objects.move_bottle_to_bin
  pose:
    position: [0.0, 0.0, 0.0]
    # XYZW identity (5.1 WXYZ [1,0,0,0]; P7R).
    orientation: [0.0, 0.0, 0.0, 1.0]
  required_surfaces: [tabletop]
  surface_overrides:
    tabletop:
      type: manual
      shape: rectangle
      frame: world
      center: [1.5, -0.95, 0.7067]
      x_axis: [0.0, 1.0, 0.0]
      y_axis: [-1.0, 0.0, 0.0]
      normal: [0.0, 0.0, 1.0]
      bounds:
        x: [-0.51514, 0.51269]
        y: [-0.19576, 0.20072]
objects:
- id: table
  asset: {type: asset_id, id: move_bottle_to_bin_table}
  semantic_tags: [table, navigation_target]
- id: bin
  asset: {type: asset_id, id: move_bottle_to_bin_bin}
  semantic_tags: [bin, container, place_target, navigation_target]
- id: bottle
  asset:
    type: pool
    cache_size: 4
    candidates:
    - id: bottle_pool
      from_file: assets/pools/move_bottle_to_bin/pickables_bottle.json
  semantic_tags: [pickable, bottle]
  scale: [1.0, 1.0, 1.0]
layout:
  surfaces:
    tabletop:
      type: ref
      ref: background.tabletop
  nodes:
    table:
      object: table
      placement:
        type: pose
        poses:
        - id: fixed
          position: [1.5, -0.95, 0.0]
          # XYZW yaw≈+90° (5.1 WXYZ [0.707107,0,0,0.707107]; P7R).
          orientation: [0.0, 0.0, 0.707107, 0.707107]
    bin:
      object: bin
      placement:
        type: pose
        poses:
        - id: fixed
          position: [1.3, 0.06, 0.0]
          # XYZW yaw≈-90° (5.1 WXYZ [0.707107,0,0,-0.707107]; P7R).
          orientation: [0.0, 0.0, -0.707107, 0.707107]
    bottle:
      object: bottle
      placement:
        type: pose
        poses:
        - id: fixed
          position: [1.45, -0.95, 0.86]
          # XYZW identity (5.1 WXYZ [1,0,0,0]; P7R).
          orientation: [0.0, 0.0, 0.0, 1.0]
variants:
  materialization:
  - id: bottle_pick
    type: asset_pool_choice
    choices:
    - {id: pick, candidate_refs: [bottle.bottle_pool], weight: 1.0}
  assignments: []
