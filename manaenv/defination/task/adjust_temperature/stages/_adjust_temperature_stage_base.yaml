# Shared adjust_temperature stage base. Reuses scene/adjust_temperature_vnext.yaml
# (entity id knob_a). Pose + temperature sampling live on the graph DAG so
# composite EventsCfg merge does not see per-node Asset-identity drift.
# Success checks the operated knob joint at the pinned target / arm home.
direct_task_generator:
  definition:
    gen_method: 0
    episode_length_s: 180.0
    num_episodes: 1
    max_steps_per_episode: 5400
  component_sections:
    termination_component:
      terms:
        mdp.time_out:
          time_out: true
    event_component:
      terms:
        mdp.reset_scene_to_default:
          mode: reset
          reset_joint_targets: true
    metric_component:
      terms:
        success_rate: {}
    viewer_component:
      terms:
        look_at_object:
          lookat_object: knob_a
          offset:
          - -1.0
          - 0.0
          - 1.5
    scene_constraint_component:
      constraints:
      - mode: 0
        tags: adjust_temperature_scene
