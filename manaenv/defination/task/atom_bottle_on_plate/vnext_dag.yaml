graph_task_generator:
  definition:
    task_type: put_bottle_on_plate
    runtime_instruction:
      plan_id: runtime
      tag_mode: kind
      objects:
        bottle: bottle
      template: Pick up the bottle and place it on the plate, then return the arm home.
      subtasks:
      - Pick up the bottle and place it on the plate.
      - Return the arm home.
    layout:
      runtime_sample:
        id: runtime
        targets:
          assets:
          - id: bottle_asset
            target:
              type: node
              id: bottle
            selector:
              type: uniform
            cache_size: 5
          - id: plate_asset
            target:
              type: node
              id: plate
            selector:
              type: uniform
            cache_size: 5
          placements:
          - id: bottle
            target:
              type: node
              id: bottle
            sample:
              type: inherit
          - id: plate
            target:
              type: node
              id: plate
            sample:
              type: inherit
    component_sections:
      instruction_component:
        instructions:
        - text: Pick up the bottle and place it on the plate, then return the arm home.
          log:
            instruction_variant: direct
        subtasks:
        - Pick up the bottle and place it on the plate.
        - Return the arm home.
  nodes:
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 5400
        task_type: atom_bottle_on_plate_pick_bottle
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg: '@pickable'
              minimum_height: -0.25
              ignore_below: -1.0
            success:
              mode: or
              terms:
              - grasp_left:
                  _func: grasp_left_1
                  object_cfg: '@pickable'
                  force_threshold: 0.1
                  lifted_z_min: null
                  consecutive_steps: 5
              - grasp_right:
                  _func: grasp_right_1
                  object_cfg: '@pickable'
                  force_threshold: 0.1
                  lifted_z_min: null
                  consecutive_steps: 5
              - grasp_franka:
                  _func: gripper_grasps_object
                  contact_sensor_cfg: gripper_contact
                  object_cfg: '@pickable'
                  force_threshold: 0.1
                  lifted_z_min: null
                  consecutive_steps: 5
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_object:
              lookat_object: '@pickable'
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: schema_vnext_atom_bottle_on_plate
        log_component:
          entries:
            progress:
              trigger: success
              value: grasp @pickable.name
    id: pick_bottle
    score: 4
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 5400
        task_type: atom_bottle_on_plate_place_bottle
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg: '@pickable'
              minimum_height: -0.25
              ignore_below: -1.0
            success:
              terms:
              - bottle_in_zone:
                  _func: object_position_in_zone
                  object_cfg: '@pickable'
                  reference_cfg: '@destination'
                  reference_footprint_zone: true
                  xy_inset_ratio: 0.15
                  z_range:
                  - 0.0
                  - 0.22
                  velocity_threshold: 0.05
                  consecutive_steps: 5
              - bottle_upright:
                  _func: object_tilt_in_range
                  object_cfg: '@pickable'
                  axis: z
                  min_dot: 0.9
                  max_dot: 1.0
                  velocity_threshold: 0.05
                  consecutive_steps: 5
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_object:
              lookat_object: '@pickable'
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: schema_vnext_atom_bottle_on_plate
        log_component:
          entries:
            progress:
              trigger: success
              value: put @pickable.name on @destination.name
            bottle_on_plate_zone:
              trigger: enter
              func: object_position_in_zone
              params:
                object_cfg: '@pickable'
                reference_cfg: '@destination'
                reference_footprint_zone: true
                xy_inset_ratio: 0.15
                z_range:
                - 0.0
                - 0.22
                velocity_threshold: 0.05
                consecutive_steps: 1
                log_prefix: bottle_on_plate
                log_interval: 0
              update_mode: max
    id: place_bottle
    score: 3
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 5400
        task_type: atom_bottle_on_plate_return
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg: '@pickable'
              minimum_height: -0.25
              ignore_below: -1.0
            success:
              terms:
              - arm_home:
                  _func: articulation_joints_near_default
                  asset_cfg: robot
                  atol: 0.4
                  consecutive_steps: 10
                  exclude_joint_name_substrings:
                  - finger
                  - gripper
                  - knuckle
              - bottle_upright:
                  _func: object_tilt_in_range
                  object_cfg: '@pickable'
                  axis: z
                  min_dot: 0.98
                  max_dot: 1.0
                  velocity_threshold: 0.05
                  consecutive_steps: 5
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_object:
              lookat_object: '@pickable'
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: schema_vnext_atom_bottle_on_plate
        log_component:
          entries:
            progress:
              trigger: success
              value: return to home
    id: return
    score: 1
  edges:
  - src: pick_bottle
    dst: place_bottle
  - src: place_bottle
    dst: return
