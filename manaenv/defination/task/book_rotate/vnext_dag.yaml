graph_task_generator:
  definition:
    task_type: book_rotate
    layout:
      runtime_sample:
        id: runtime
        targets:
          assets:
          - id: book_asset
            target:
              type: node
              id: book
            selector:
              type: uniform
          placements:
          - id: book
            target:
              type: node
              id: book
            sample:
              type: inherit
    component_sections:
      log_component:
        entries:
          active_book_asset:
            trigger: enter
            func: schema_vnext_active_asset_ids_label
            params:
              object_names:
              - book
      instruction_component:
        instructions:
        - text: Rotate the book on the table about Z to about -90 degrees (reader orientation), then return the arms home.
          log:
            instruction_variant: direct
      overlay_component:
        evaluation: true
        entries:
        - log_key: active_book_asset
          label: Book
          font_size: 24
  nodes:
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 1000
        task_type: book_rotate_rotate
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg: '@rotatable'
              minimum_height: -0.25
              ignore_below: -1.0
            success:
              _func: object_yaw_in_range
              object_cfg: '@rotatable'
              signed: true
              min_yaw_deg: -110.0
              max_yaw_deg: -70.0
              velocity_threshold: 0.5
              consecutive_steps: 5
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_object:
              lookat_object: '@rotatable'
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: book_rotate_scene
        sensor_component:
          sensors:
          - left_gripper_contact_sensor:
              type: contact
              source: '@rotatable'
              against:
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
          - right_gripper_contact_sensor:
              type: contact
              source: '@rotatable'
              against:
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
        log_component:
          entries:
            progress:
              trigger: success
              value: rotate @rotatable.name to yaw ≈ -90 deg about Z
    id: rotate
    score: 8
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 1000
        task_type: book_rotate_return
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg: '@rotatable'
              minimum_height: -0.25
              ignore_below: -1.0
            success:
              terms:
              - arm_home:
                  _func: articulation_joints_near_default
                  asset_cfg: robot
                  atol: 0.4
                  consecutive_steps: 10
              - reader_yaw:
                  _func: object_yaw_in_range
                  object_cfg: '@rotatable'
                  signed: true
                  min_yaw_deg: -110.0
                  max_yaw_deg: -70.0
                  velocity_threshold: 0.5
                  consecutive_steps: 5
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_object:
              lookat_object: '@rotatable'
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: book_rotate_scene
        sensor_component:
          sensors:
          - left_gripper_contact_sensor:
              type: contact
              source: '@rotatable'
              against:
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
          - right_gripper_contact_sensor:
              type: contact
              source: '@rotatable'
              against:
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
        log_component:
          entries:
            progress:
              trigger: success
              value: return to home
    id: return
    score: 2
  edges:
  - src: rotate
    dst: return
