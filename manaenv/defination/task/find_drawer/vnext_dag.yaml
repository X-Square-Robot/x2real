graph_task_generator:
  definition:
    task_type: find_drawer
    layout:
      runtime_sample:
        id: runtime
        targets:
          assets:
          - id: brick_asset
            target:
              type: node
              id: brick
            selector:
              type: uniform
          placements:
          - id: brick
            target:
              type: node
              id: brick
            sample:
              type: inherit
    component_sections:
      event_component:
        terms:
          sample_find_drawer:
            mode: reset
            num_layers: 3
            layer_labels:
            - top
            - middle
            - bottom
            layer_log_key: find_drawer_target_layer
            instruction_template: Open the {layer} drawer, put the brick inside, close it, wait a few seconds, then reopen
              the same drawer, take the brick out, close it, and return the arm home.
      log_component:
        entries:
          find_drawer_plan:
            trigger: enter
            func: find_drawer_active_label
      instruction_component:
        topic: find_drawer
      overlay_component:
        evaluation: true
        entries:
        - log_key: find_drawer_plan
          label: Task
          font_size: 24
  nodes:
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 240.0
        num_episodes: 10
        max_steps_per_episode: 1600
        task_type: find_drawer_open_drawer
      roles:
        containable: containable
        pickable: pickable
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg: '@pickable'
              minimum_height: -0.35
              ignore_below: -5.0
            success:
              _func: indexed_joint_above_threshold
              object_cfg: '@containable'
              joint_names:
              - PrismaticJoint_01
              - PrismaticJoint_02
              - PrismaticJoint_03
              index_log_key: find_drawer_target_layer
              threshold: 0.25
              openness_gt: true
              consecutive_steps: 2
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_position:
              lookat_position:
              - 0.204651
              - -0.268246
              - -0.240423
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: find_drawer_scene
        log_component:
          entries:
            progress:
              trigger: success
              value: open the target drawer
    id: open_drawer
    score: 3
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 240.0
        num_episodes: 10
        max_steps_per_episode: 1600
        task_type: find_drawer_pick_item
      roles:
        containable: containable
        pickable: pickable
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg: '@pickable'
              minimum_height: -0.35
              ignore_below: -5.0
            success:
              mode: or
              terms:
              - grasp_left:
                  _func: grasp_left_1
                  object_cfg: '@pickable'
                  force_threshold: 0.1
                  lifted_z_min: null
                  consecutive_steps: 5
              - grasp_right:
                  _func: grasp_right_1
                  object_cfg: '@pickable'
                  force_threshold: 0.1
                  lifted_z_min: null
                  consecutive_steps: 5
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_position:
              lookat_position:
              - 0.204651
              - -0.268246
              - -0.240423
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: find_drawer_scene
        log_component:
          entries:
            progress:
              trigger: success
              value: pick up the brick
    id: pick_item
    score: 3
