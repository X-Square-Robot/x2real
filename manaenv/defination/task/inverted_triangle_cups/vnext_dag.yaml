graph_task_generator:
  definition:
    task_type: arrange_cup_inverted_triangle
    layout:
      runtime_sample:
        id: runtime
        targets:
          placements:
          - id: cup_1
            target:
              type: node
              id: cup_1
            sample:
              type: inherit
          - id: cup_2
            target:
              type: node
              id: cup_2
            sample:
              type: inherit
          - id: cup_3
            target:
              type: node
              id: cup_3
            sample:
              type: inherit
    component_sections:
      instruction_component:
        instructions:
        - text: Arrange the three cups into a triangle. Place the first cup in the center, place the second cup next to it,
            then place the third cup on top. Finally return the arm to the home position.
          log:
            instruction_variant: direct
      overlay_component:
        evaluation: true
        entries: []
  nodes:
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 1000
        task_type: inverted_triangle_cups_first_cup_picked
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg: '@pickable'
              minimum_height: -0.25
            success:
              _func: gripper_nth_object_lifted
              gripper_contact_sensor_cfgs:
              - '@gripper_contact_sensor_1'
              - '@gripper_contact_sensor_2'
              - '@gripper_contact_sensor_3'
              object_cfgs:
              - '@pickable_1'
              - '@pickable_2'
              - '@pickable_3'
              nth: 1
              min_lift: 0.03
              force_threshold: 0.01
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_position:
              lookat_position:
              - 0.204651
              - -0.268246
              - -0.240423
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: inverted_triangle_cups_scene
        sensor_component:
          sensors:
          - contact_sensor_1:
              type: contact
              source: '@pickable_1'
              against:
              - '@pickable_2'
              - '@pickable_3'
          - contact_sensor_2:
              type: contact
              source: '@pickable_2'
              against:
              - '@pickable_1'
              - '@pickable_3'
          - contact_sensor_3:
              type: contact
              source: '@pickable_3'
              against:
              - '@pickable_1'
              - '@pickable_2'
          - gripper_contact_sensor_1:
              type: contact
              source: '@pickable_1'
              against:
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
          - gripper_contact_sensor_2:
              type: contact
              source: '@pickable_2'
              against:
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
          - gripper_contact_sensor_3:
              type: contact
              source: '@pickable_3'
              against:
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
              - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
        log_component:
          entries:
            progress:
              trigger: success
              value: pick up the first cup
    id: first_cup_picked
    score: 1
