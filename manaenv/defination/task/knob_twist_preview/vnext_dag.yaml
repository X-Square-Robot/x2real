graph_task_generator:
  definition:
    task_type: knob_twist_preview
    planner_skill_boundary:
      prefix:
      - type: home
      - type: stay
    planner_skill_defaults:
      twist:
        grasp_label_manifest: assets/grasp_labels/manifest.yaml
        grasp_label_asset: knob_a
        arm: auto
        approach_distance: 0.03
        joint_axis_local:
        - 0.0
        - 0.0
        - 1.0
        hinge_pivot_local:
        - 0.0
        - 0.0
        - 0.0
        arc_samples: 12
        retreat_distance: 0.03
        top_k: 48
        winner_plan_failure_cooldown: 8
        gripper_open: open
        gripper_close: closed
        gripper_open_fraction: 0.25
        regrasp_joint_steps: 20
        flip_joint_steps: 30
      home:
        gripper: closed
        steps: 20
      stay:
        gripper: closed
        steps: 20
    component_sections:
      instruction_component:
        instructions:
        - text: Adjust the knob from temperature {initial} to {target}, then return the arm home.
          log:
            instruction_variant: direct
        subtasks:
        - Twist the knob from temperature {initial} to {target}.
        - Return the arm home after reaching temperature {target}.
  nodes:
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 1
        max_steps_per_episode: 5400
        task_type: knob_twist_preview_twist
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            success:
              _func: joint_reaches_sampled_openness
              object_cfg: '@turnable'
              joint_names:
              - RevoluteJoint
              tolerance: 0.052
              consecutive_steps: 2
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
            sample_turnable_twist_goal:
              mode: reset
              asset_cfg: '@turnable'
              joint_name: RevoluteJoint
              initial_temperature_range:
              - 0
              - 60
              target_delta_temperature_range:
              - 0
              - 60
              min_delta_temperature: 30
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_object:
              lookat_object: '@turnable'
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: knob_twist_preview_scene
        log_component:
          entries:
            twist_initial_temperature:
              trigger: enter
              func: twist_episode_initial_temperature
            twist_target_temperature:
              trigger: enter
              func: twist_episode_target_temperature
            twist_result:
              trigger: success
              func: twist_episode_result_label
              update_mode: last
            progress:
              trigger: success
              value: twist the knob to the sampled target temperature
        planner_skills_component:
          skills:
          - type: twist
            params:
              object_name: '@turnable'
              handle_body_name: knob
              joint_name: RevoluteJoint
          - type: stay
    id: twist
    score: 3
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 1
        max_steps_per_episode: 5400
        task_type: knob_twist_preview_return
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            success:
              _func: merged
              mode: and
              terms:
              - knob_at_target:
                  _func: joint_reaches_sampled_openness
                  object_cfg: '@turnable'
                  joint_names:
                  - RevoluteJoint
                  tolerance: 0.052
                  consecutive_steps: 2
              - robot_home:
                  _func: articulation_joints_near_default
                  asset_cfg: robot
                  atol: 0.3
                  consecutive_steps: 10
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
            sample_turnable_twist_goal:
              mode: reset
              asset_cfg: '@turnable'
              joint_name: RevoluteJoint
              initial_temperature_range:
              - 0
              - 60
              target_delta_temperature_range:
              - 0
              - 60
              min_delta_temperature: 30
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_object:
              lookat_object: '@turnable'
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: knob_twist_preview_scene
        log_component:
          entries:
            twist_result:
              trigger: success
              func: twist_episode_result_label
              update_mode: last
            progress:
              trigger: success
              value: knob at target temperature and return home
        planner_skills_component:
          skills:
          - type: home
    id: return
    score: 1
  edges:
  - src: twist
    dst: return
