include: task/move_bottle_to_bin/stages/_stage_base.yaml
direct_task_generator:
  definition: {task_type: move_bottle_to_bin_place_bottle, stage_timeout_steps: 600}
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          # Bin success = bottle in active bin footprint (no bottle upright).
          # P10D2B: upright removed; container zone is the place gate.
          - bottle_in_active_bin:
              _func: object_position_in_zone
              object_cfg: "@pickable"
              reference_cfg: "@bin"
              reference_footprint_zone: true
              xy_inset_ratio: 0.1
              z_range: [-0.03, 0.22]
              velocity_threshold: 0.03
              consecutive_steps: 5
              _latch: true
    log_component: {entries: {progress: {trigger: success, value: place the bottle in the bin}}}
    planner_stage_component: {type: skill_trajectory, params: {include_prefix: false, include_tail: false}}
    planner_skills_component:
      skills:
      - type: place
        params:
          object_name: "@pickable"
