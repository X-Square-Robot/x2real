include: task/move_fruit_to_basket/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: move_fruit_to_basket_navigate_to_basket_table
    stage_timeout_steps: 900
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - basket_table_operation_zone:
              _func: base_in_operation_zone
              robot_cfg: robot
              zone_key: basket_table_operation_zone
              context_namespace: mobile_manip
              context_plan_id: move_fruit_to_basket
              linear_speed_max: 0.05
              angular_speed_max: 0.12
              consecutive_steps: 3
              _latch: true
          - fruit_kept_high:
              _func: object_position_in_zone
              object_cfg: "@pickable"
              y_range: [-1.40, -0.50]
              z_range: [0.74, 1.40]
              consecutive_steps: 3
              _latch: true
    log_component:
      entries:
        progress:
          trigger: success
          value: navigate to the basket table while holding @pickable.name
