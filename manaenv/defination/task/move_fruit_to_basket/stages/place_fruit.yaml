include: task/move_fruit_to_basket/stages/_stage_base.yaml
direct_task_generator:
  definition: {task_type: move_fruit_to_basket_place_fruit, stage_timeout_steps: 600}
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - fruit_in_basket:
              _func: object_position_in_zone
              object_cfg: "@pickable"
              reference_cfg: "@basket"
              reference_footprint_zone: true
              xy_inset_ratio: 0.1
              z_range: [-0.03, 0.22]
              velocity_threshold: 0.03
              consecutive_steps: 5
              _latch: true
    log_component: {entries: {progress: {trigger: success, value: place the fruit in the basket}}}
    planner_stage_component: {type: skill_trajectory, params: {include_prefix: false, include_tail: false}}
    planner_skills_component:
      skills:
      - type: place
        params:
          object_name: "@pickable"
          target: {strategy: bbox_ratio, object_name: "@basket", x_ratio_range: [0.42, 0.58], y_ratio_range: [0.42, 0.58]}
      - type: stay
