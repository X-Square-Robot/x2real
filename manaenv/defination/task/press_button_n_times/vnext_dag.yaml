graph_task_generator:
  definition:
    task_type: press_button_n_times
    component_sections:
      event_component:
        terms:
          sample_press_button_n_times:
            mode: reset
            object_name: pump_bottle
            slot_poses:
            - - 0.2
              - -0.1
              - -0.240423
            - - 0.2
              - -0.27
              - -0.240423
            - - 0.2
              - -0.44
              - -0.240423
            count_choices:
            - 3
            - 4
            - 5
            - 6
            count_log_key: target_press_count
            slot_log_key: bottle_slot
            orientation:
            - 0.0
            - 0.0
            - 0.0
            - 1.0
            instruction_template: Hold the pump bottle steady and press the pump head {n} times, then return home.
      log_component:
        entries:
          target_press_count_text:
            trigger: enter
            func: pump_target_press_count_label
            params:
              log_key: target_press_count
          bottle_slot_text:
            trigger: enter
            func: pump_bottle_slot_label
      instruction_component:
        instruction: Hold the pump bottle steady and press the pump head the target number of times, then return home.
        topic: press_button_n_times
      overlay_component:
        evaluation: true
        entries:
        - log_key: target_press_count_text
          label: Target presses
          font_size: 24
        - log_key: bottle_slot_text
          label: Bottle slot
          font_size: 24
  nodes:
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 1200
        task_type: press_button_n_times_fix_bottle
      roles:
        pump_bottle: pump_bottle
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            success:
              mode: or
              terms:
              - grasp_left:
                  _func: grasp_left_1
                  object_cfg: '@pump_bottle'
                  force_threshold: 0.1
                  lifted_z_min: null
                  consecutive_steps: 5
              - grasp_right:
                  _func: grasp_right_1
                  object_cfg: '@pump_bottle'
                  force_threshold: 0.1
                  lifted_z_min: null
                  consecutive_steps: 5
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_position:
              lookat_position:
              - 0.204651
              - -0.268246
              - -0.240423
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: press_button_n_times_scene
        log_component:
          entries:
            progress:
              trigger: success
              value: grasp @pump_bottle.name with either hand
    id: fix_bottle
    score: 3
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 1200
        task_type: press_button_n_times_press_loop
      roles:
        pump_bottle: pump_bottle
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            success:
              _func: pump_pressed_n_times
              object_cfg: '@pump_bottle'
              joint_names:
              - PrismaticJoint
              press_threshold: 0.6
              release_threshold: 0.25
              openness_gt: true
              count_log_key: target_press_count
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_position:
              lookat_position:
              - 0.204651
              - -0.268246
              - -0.240423
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: press_button_n_times_scene
        log_component:
          entries:
            progress:
              trigger: success
              value: pressed pump head to target count
    id: press_loop
    score: 5
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 180.0
        num_episodes: 10
        max_steps_per_episode: 1200
        task_type: press_button_n_times_return
      roles:
        pump_bottle: pump_bottle
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            success:
              _func: articulation_joints_near_default
              asset_cfg: robot
              atol: 0.4
              consecutive_steps: 10
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_position:
              lookat_position:
              - 0.204651
              - -0.268246
              - -0.240423
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: press_button_n_times_scene
        log_component:
          entries:
            progress:
              trigger: success
              value: return to home
    id: return
    score: 2
  edges:
  - src: fix_bottle
    dst: press_loop
  - src: press_loop
    dst: return
