include: task/put_bottle_on_woodshelf/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: put_bottle_on_woodshelf_place_bottle
    stage_timeout_steps: 600
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          # The DAG latches this completed stage for scoring.  These physical
          # predicates must remain momentary: _latch here would accept the
          # bottle's upright reset pose rather than its placement pose.
          - bottle_on_shelf_zone:
              _func: object_position_in_zone
              object_cfg: "@pickable"
              x_range: [0.09, 1.16]
              y_range: [-1.88, -1.69]
              z_range: [0.16, 0.85]
              velocity_threshold: 0.03
              consecutive_steps: 5
          - bottle_upright:
              _func: object_tilt_in_range
              object_cfg: "@pickable"
              axis: z
              min_dot: 0.95
              max_dot: 1.0
              velocity_threshold: 0.03
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: place @pickable.name on @shelf.name
    planner_stage_component:
      type: skill_trajectory
      params:
        include_prefix: false
        include_tail: false
    planner_skills_component:
      skills:
      - type: place
        params:
          object_name: "@pickable"
          target:
            strategy: bbox_ratio
            object_name: shelf
            x_ratio_range: [0.45, 0.55]
            y_ratio_range: [0.42, 0.58]
      - type: stay
