include: task/put_bottle_on_woodshelf/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: put_bottle_on_woodshelf_retract_arm
    stage_timeout_steps: 900
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - arms_retracted:
              _func: articulation_joints_near_default
              asset_cfg: robot
              joint_names:
              - left_arm_joint1
              - left_arm_joint2
              - left_arm_joint3
              - left_arm_joint4
              - left_arm_joint5
              - left_arm_joint6
              - right_arm_joint1
              - right_arm_joint2
              - right_arm_joint3
              - right_arm_joint4
              - right_arm_joint5
              - right_arm_joint6
              atol: 0.3
              consecutive_steps: 10
          # Terminal physical re-check.  Do not latch either predicate: a bottle
          # starts upright on the source table, and a bottle that tips during
          # arm retraction must not earn the final two points.
          - bottle_on_shelf_zone:
              _func: object_position_in_zone
              object_cfg: "@pickable"
              x_range: [0.09, 1.16]
              y_range: [-1.88, -1.69]
              z_range: [0.16, 0.85]
              velocity_threshold: 0.03
              consecutive_steps: 5
          - bottle_upright:
              _func: object_tilt_in_range
              object_cfg: "@pickable"
              axis: z
              min_dot: 0.95
              max_dot: 1.0
              velocity_threshold: 0.03
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: return both arms to a safe home pose after place
    planner_stage_component:
      type: skill_trajectory
      params:
        include_prefix: false
        include_tail: false
    planner_skills_component:
      skills:
      - type: home
