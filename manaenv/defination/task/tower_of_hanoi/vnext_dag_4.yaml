        targets:
          placements:
          - id: pegs
            target:
              type: group
              id: pegs
            sample:
              type: inherit
    component_sections:
      event_component:
        terms:
          sample_tower_of_hanoi:
            mode: reset
            seed: 9101
            n: 4
            ring_names:
            - ring_a
            - ring_b
            - ring_c
            - ring_d
            - ring_e
            left_peg_xy:
            - 0.155
            - -0.148
            layer_z_center:
            - -0.2029
            - -0.1849
            - -0.1669
            - -0.1489
            - -0.1309
            layer_z_bottom:
            - -0.2104
            - -0.1924
            - -0.1744
            - -0.1564
            - -0.1384
            bottom_origin_rings:
            - ring_a
            away_z: -10.0
            instruction_template: Move the 4 rings from the left peg to the right peg. Move one ring at a time, and never
              place a larger ring on a smaller one.
      instruction_component:
        instructions:
        - text: Move the 4 rings from the left peg to the right peg. Move one ring at a time, and never place a larger ring
            on a smaller one.
          log:
            instruction_variant: direct
        topic: tower_of_hanoi
      log_component:
        entries:
          tower_of_hanoi_plan:
            trigger: enter
            func: tower_of_hanoi_plan_label
  roles:
    disk_1: disk_1
    disk_2: disk_2
    disk_3: disk_3
    disk_4: disk_4
    disk_5: disk_5
  nodes:
  - direct_task_generator:
      definition:
        gen_method: 0
        episode_length_s: 600.0
        num_episodes: 10
        max_steps_per_episode: 8000
        task_type: tower_of_hanoi_4_move_1
      roles:
        disk_1: disk_1
        disk_2: disk_2
        disk_3: disk_3
        disk_4: disk_4
        disk_5: disk_5
      component_sections:
        termination_component:
          terms:
            mdp.time_out:
              time_out: true
            object_dropped:
              object_cfg:
              - ring_a
              - ring_b
              - ring_c
              - ring_d
              - ring_e
              minimum_height: -0.25
              ignore_below: -1.0
            success:
              _func: hanoi_state_matches
              ring_names:
              - ring_a
              - ring_b
              - ring_c
              - ring_d
              - ring_e
              peg_names:
              - peg_left
              - peg_mid
              - peg_right
              expected:
                peg_left:
                - 4
                - 3
                - 2
                peg_mid:
                - 1
                peg_right: []
              xy_tolerance: 0.03
              min_z: -1.0
              velocity_threshold: 0.2
              consecutive_steps: 5
        event_component:
          terms:
            mdp.reset_scene_to_default:
              mode: reset
              reset_joint_targets: true
        metric_component:
          terms:
            success_rate: {}
        viewer_component:
          terms:
            look_at_object:
              lookat_object: peg_mid
              offset:
              - -1.0
              - 0.0
              - 1.5
        scene_constraint_component:
          constraints:
          - mode: 0
            tags: schema_vnext_tower_of_hanoi
        log_component:
          entries:
            progress:
              trigger: success
              value: move the smallest ring from the left peg to the middle peg
        planner_skills_component:
          skills:
          - type: pick
            params:
              object_name: '@disk_1'
              grasp_label_asset: '@disk_1'
              arm: left
              top_k: 20
          - type: place
            params:
              object_name: '@disk_1'
              arm: current
              target:
