################################################################################
# X2Real formal public ID evaluation catalog.
# Adapted from manaenv dev-6.0 ab197fa0611937e5bff2c90bf6f1e35145470199.
# Run through manaenv/scripts/x2real_eval.py; boards.yaml is the case authority.
# Contains exactly 73 benchmark assemblies and no held-out-axis definitions.
################################################################################

data_center:
  type: default_data_center
task_factory:
  type: default_task_factory
scene_factory:
  type: default_scene_factory
  scene_runtime:
    include: runtime/timestep/normal.yaml
  render_settings:
    include: runtime/renderer/x2bench_realtime.yaml
    enable_dlssg: false
    dlssg_multiplier: null
robot_factory:
  type: default_robot_factory
assembly_factory:
  type: default_assembly_factory
rollout_factory: {}
pipeline:
  pipeline_runtime:
    include: runtime/solver/physx_cpu_async.yaml
    stream_viewports:
      include: runtime/viewport/three_camera_stream_layout.yaml
      cameras:
      - left_wrist_camera
      - name: head_camera
        width: 960
        height: 540
      - right_wrist_camera
  pipeline_dag:
    nodes:
    - pipeline_dag_node:
        cfg_key: data_center
        orders:
        - output
    - pipeline_dag_node:
        cfg_key: task_factory
        orders:
        - task_orders
        after:
        - data_center
        deps:
          data_center: data_center
    - pipeline_dag_node:
        cfg_key: scene_factory
        orders:
        - scene_orders
        after:
        - data_center
        deps:
          data_center: data_center
    - pipeline_dag_node:
        cfg_key: robot_factory
        orders:
        - robot_orders
        after:
        - data_center
        deps:
          data_center: data_center
        runtime: pipeline_runtime
    - pipeline_dag_node:
        cfg_key: assembly_factory
        orders:
        - assembly_orders
        after:
        - task_factory
        - scene_factory
        - robot_factory
        deps:
          data_center: data_center
          task_factory: task_factory
        runtime: pipeline_runtime
    - pipeline_dag_node:
        cfg_key: rollout_factory
        orders:
        - rollout
        after:
        - assembly_factory
        deps:
          data_center: data_center
          assembly_factory: assembly_factory
        foreach: env_ref
