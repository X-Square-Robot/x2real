include: x2real/task/bimanual_collaboration/glasses_on_rack/stages/_glasses_on_rack_stage_base.yaml
direct_task_generator:
  definition:
    task_type: glasses_on_rack_hang_on_rack
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - both_grippers_held_glasses:
              _latch: true
              terms:
              - left_gripper_contact_glasses:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@left_gripper_contact_sensor'
                  force_threshold: 0.1
                  consecutive_steps: 5
              - right_gripper_contact_glasses:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@right_gripper_contact_sensor'
                  force_threshold: 0.1
                  consecutive_steps: 5
          - glasses_on_rack_contact:
              _func: object_contact_destination
              contact_sensor_cfgs: '@destination_contact_sensor'
              force_threshold: 0.01
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: hang @pickable.name on @rackable.name
