include: x2real/task/bimanual_collaboration/hand_over_coin/stages/_hand_over_coin_stage_base.yaml
direct_task_generator:
  definition:
    task_type: hand_over_coin_pick_first
  component_sections:
    termination_component:
      terms:
        success:
          mode: or
          terms:
          - left_first_grasp:
              _func: object_contact_destination
              contact_sensor_cfgs: '@left_gripper_contact_sensor'
              force_threshold: 0.1
              consecutive_steps: 5
          - right_first_grasp:
              _func: object_contact_destination
              contact_sensor_cfgs: '@right_gripper_contact_sensor'
              force_threshold: 0.1
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: grasp @pickable.name with either hand
