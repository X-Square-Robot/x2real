# Shared buttons_press_sequence stage base.
# Graph-level reset samples the with-replacement press order and scatters buttons.
# Success is joint hysteresis (0→1→0) on articulated button_aa/ab/ac/ad.
direct_task_generator:
  definition:
    gen_method: 0
    episode_length_s: 360.0
    num_episodes: 10
    max_steps_per_episode: 10800
  component_sections:
    termination_component:
      terms:
        mdp.time_out:
          time_out: true
    event_component:
      terms:
        mdp.reset_scene_to_default:
          mode: reset
          reset_joint_targets: true
    metric_component:
      terms:
        success_rate: {}
    viewer_component:
      terms:
        look_at_position:
          lookat_position:
          - 0.204651
          - -0.268246
          - -0.240423
          offset:
          - -1.0
          - 0.0
          - 1.5
    scene_constraint_component:
      constraints:
      - mode: 0
        tags: buttons_press_sequence_scene
