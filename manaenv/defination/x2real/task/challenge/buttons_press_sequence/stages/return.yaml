# Stage: return — drive arms home after the press sequence.
include: x2real/task/challenge/buttons_press_sequence/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: buttons_press_sequence_return
  component_sections:
    termination_component:
      terms:
        success:
          _func: articulation_joints_near_default
          asset_cfg: robot
          atol: 0.3
          consecutive_steps: 10
          exclude_joint_name_substrings: [finger, gripper, knuckle]
        failure_extra_button:
          _func: button_wrong_joint_pressed_in_order
          button_assets: [button_blue, button_yellow, button_red, button_green]
          color_order: [blue, yellow, red, green]
          joint_names: [PrismaticJoint]
          press_threshold: 0.6
          release_threshold: 0.25
          openness_gt: true
          order_log_key: button_press_order
    log_component:
      entries:
        progress:
          trigger: success
          value: return to home
