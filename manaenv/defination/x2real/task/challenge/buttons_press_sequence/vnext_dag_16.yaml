################################################################################
# buttons_press_sequence L=16 graph task.
# Shared scene; reset samples a with-replacement order of length 16.
# Nodes include stages/press.yaml and override success.position only.
################################################################################
graph_task_generator:
  definition:
    task_type: buttons_press_sequence_16
    component_sections:
      event_component:
        terms:
          sample_button_press_sequence:
            mode: reset
            seed: 8016
            sequence_length: 16
            button_colors: [blue, yellow, red, green]
            button_prefix: button_
            order_log_key: button_press_order
            order_log_width: 16
            instruction_template: "Press the buttons in this order: {order}, then return the arm home."
            region: {x: [0.004, 0.156], y: [-0.719, 0.182], z: [-0.2186, -0.2186]}
            min_separation: 0.15
      log_component:
        entries:
          button_press_order_text:
            trigger: enter
            func: button_active_order
            params:
              state_attr: _mana_buttons_press_sequence_state
      instruction_component:
        topic: buttons_press_sequence
      overlay_component:
        evaluation: true
        entries:
          - log_key: button_press_order_text
            label: Press order
            font_size: 24
  nodes:
  - id: press_1
    score: 3
    include: x2real/task/challenge/buttons_press_sequence/stages/press.yaml
    direct_task_generator:
      definition:
        task_type: buttons_press_sequence_press_1
      component_sections:
        termination_component:
          terms:
            success:
              position: 1
        log_component:
          entries:
            progress:
              params:
                position: 1
