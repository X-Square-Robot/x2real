################################################################################
# buttons_press_sequence L=4 graph task.
# Shared scene; reset samples a with-replacement order of length 4.
# Nodes include stages/press.yaml and override success.position only.
################################################################################
graph_task_generator:
  definition:
    task_type: buttons_press_sequence_4
    component_sections:
      event_component:
        terms:
          sample_button_press_sequence:
            mode: reset
            seed: 8004
            sequence_length: 4
            button_colors: [blue, yellow, red, green]
            button_prefix: button_
            order_log_key: button_press_order
            order_log_width: 4
            instruction_template: "Press the buttons in this order: {order}, then return the arm home."
            region: {x: [0.004, 0.156], y: [-0.719, 0.182], z: [-0.2186, -0.2186]}
            min_separation: 0.15
      log_component:
        entries:
          button_press_order_text:
            trigger: enter
            func: button_active_order
            params:
              state_attr: _mana_buttons_press_sequence_state
      instruction_component:
        topic: buttons_press_sequence
      overlay_component:
        evaluation: true
        entries:
          - log_key: button_press_order_text
            label: Press order
            font_size: 24
  nodes:
  - id: press_1
    score: 3
    include: x2real/task/challenge/buttons_press_sequence/stages/press.yaml
    direct_task_generator:
      definition:
        task_type: buttons_press_sequence_press_1
      component_sections:
        termination_component:
          terms:
            success:
              position: 1
        log_component:
          entries:
            progress:
              params:
                position: 1
  - id: press_2
    score: 3
    include: x2real/task/challenge/buttons_press_sequence/stages/press.yaml
    direct_task_generator:
      definition:
        task_type: buttons_press_sequence_press_2
      component_sections:
        termination_component:
          terms:
            success:
              position: 2
        log_component:
          entries:
            progress:
              params:
                position: 2
  - id: press_3
    score: 3
    include: x2real/task/challenge/buttons_press_sequence/stages/press.yaml
    direct_task_generator:
      definition:
        task_type: buttons_press_sequence_press_3
      component_sections:
        termination_component:
          terms:
            success:
              position: 3
        log_component:
          entries:
            progress:
              params:
                position: 3
  - id: press_4
    score: 3
    include: x2real/task/challenge/buttons_press_sequence/stages/press.yaml
    direct_task_generator:
      definition:
        task_type: buttons_press_sequence_press_4
      component_sections:
        termination_component:
          terms:
            success:
              position: 4
        log_component:
          entries:
            progress:
              params:
                position: 4
  - id: return
    score: 1
    include: x2real/task/challenge/buttons_press_sequence/stages/return.yaml
  edges:
  - {src: press_1, dst: press_2}
  - {src: press_2, dst: press_3}
  - {src: press_3, dst: press_4}
  - {src: press_4, dst: return}
