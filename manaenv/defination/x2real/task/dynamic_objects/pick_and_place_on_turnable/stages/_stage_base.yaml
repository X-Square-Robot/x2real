direct_task_generator:
  definition:
    gen_method: 0
    episode_length_s: 180.0
    num_episodes: 10
    max_steps_per_episode: 1000
  roles:
    turntable_bricks: turntable_bricks
    turntable_plate: turntable_plate
    destination: destination
    pickable: pickable
  component_sections:
    termination_component:
      terms:
        mdp.time_out:
          time_out: true
        object_dropped:
          object_cfg: '@pickable'
          minimum_height: -0.35
          ignore_below: -5.0
    event_component:
      terms:
        mdp.reset_scene_to_default:
          mode: reset
          reset_joint_targets: true
    metric_component:
      terms:
        success_rate: {}
        object_moved_rate:
          object_cfg: '@pickable'
    viewer_component:
      terms:
        look_at_position:
          lookat_position:
          - 0.2
          - -0.24
          - -0.240423
          offset:
          - -1.0
          - 0.0
          - 1.5
    scene_constraint_component:
      constraints:
      - mode: 0
        tags: pick_and_place_on_turnable_scene
