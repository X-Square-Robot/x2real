direct_task_generator:
  definition:
    gen_method: 0
    episode_length_s: 180.0
    num_episodes: 10
    max_steps_per_episode: 1000
  component_sections:
    termination_component:
      terms:
        mdp.time_out:
          time_out: true
        object_dropped:
          object_cfg: '@pickable'
          minimum_height: -0.25
    event_component:
      terms:
        mdp.reset_scene_to_default:
          mode: reset
          reset_joint_targets: true
    metric_component:
      terms:
        success_rate: {}
        object_moved_rate:
          object_cfg: '@pickable'
    viewer_component:
      terms:
        look_at_position:
          lookat_position:
          - 0.204651
          - -0.268246
          - -0.240423
          offset:
          - -1.0
          - 0.0
          - 1.5
    scene_constraint_component:
      constraints:
      - mode: 0
        tags: inverted_triangle_cups_scene
    sensor_component:
      sensors:
      - contact_sensor_1:
          type: contact
          source: '@pickable_1'
          against:
          - '@pickable_2'
          - '@pickable_3'
      - contact_sensor_2:
          type: contact
          source: '@pickable_2'
          against:
          - '@pickable_1'
          - '@pickable_3'
      - contact_sensor_3:
          type: contact
          source: '@pickable_3'
          against:
          - '@pickable_1'
          - '@pickable_2'
      - gripper_contact_sensor_1:
          type: contact
          source: '@pickable_1'
          against:
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
      - gripper_contact_sensor_2:
          type: contact
          source: '@pickable_2'
          against:
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
      - gripper_contact_sensor_3:
          type: contact
          source: '@pickable_3'
          against:
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
