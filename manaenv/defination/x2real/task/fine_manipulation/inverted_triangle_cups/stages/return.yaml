include: x2real/task/fine_manipulation/inverted_triangle_cups/stages/_inverted_triangle_cups_stage_base.yaml
direct_task_generator:
  definition:
    task_type: inverted_triangle_cups_return
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - arm_home:
              _func: articulation_joints_near_default
              asset_cfg: robot
              atol: 0.4
              consecutive_steps: 10
          - cup_1_contact:
              _func: object_contact_destination
              contact_sensor_cfgs: '@contact_sensor_1'
              force_threshold: 0.001
              consecutive_steps: 5
          - cup_2_contact:
              _func: object_contact_destination
              contact_sensor_cfgs: '@contact_sensor_2'
              force_threshold: 0.001
              consecutive_steps: 5
          - cup_3_contact:
              _func: object_contact_destination
              contact_sensor_cfgs: '@contact_sensor_3'
              force_threshold: 0.001
              consecutive_steps: 5
          - any_cup_above_height:
              _func: object_above_height
              _combine: or
              object_cfg: '@pickable'
              min_height: -0.13
    log_component:
      entries:
        progress:
          trigger: success
          value: return to home
