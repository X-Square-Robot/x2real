include: x2real/task/fine_manipulation/plug_in_charger/stages/_plug_in_charger_stage_base.yaml
direct_task_generator:
  definition:
    task_type: plug_in_charger_insert
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - usb_xy:
              _func: object_near_nearest_reference_child_xy
              object_cfg: usb
              reference_cfg: usb_base
              reference_child_prims:
              - slot_a
              - slot_b
              - slot_c
              target_child_log_key: target_dock_slot
              xy_distance_threshold: 0.005
              velocity_threshold: 0.05
              consecutive_steps: 8
          - usb_spawn_orientation:
              _func: object_orientation_near_default
              object_cfg: usb
              min_quat_dot: 0.95
              velocity_threshold: 0.05
              consecutive_steps: 8
    log_component:
      entries:
        progress:
          trigger: success
          func: inserted_reference_child_progress
          params:
            object_cfg: usb
            reference_cfg: usb_base
            reference_child_prims:
            - slot_a
            - slot_b
            - slot_c
            target_child_log_key: target_dock_slot
    planner_skills_component:
      skills:
      - type: place
        params:
          object_name: usb
          arm: current
          batch_size: 1
          hesitate_steps: 12
          object_pose_constraint:
            enabled: true
            root_position_source: align_local_point_to_target
            rotation_mode: preserve_grasp_orientation
            contact_point_local:
            - -0.0335
            - 0.0
            - 0.0
            yaw_samples: 1
      - type: stay
