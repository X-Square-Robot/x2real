include: x2real/task/fine_manipulation/ring_on_cylinder/stages/_ring_on_cylinder_stage_base.yaml
direct_task_generator:
  definition:
    task_type: ring_on_cylinder_place_on_cylinder
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - ring_cylinder_contact:
              _func: object_contact_destination
              contact_sensor_cfgs: '@ring_cylinder_contact_sensor'
              force_threshold: 0.001
              consecutive_steps: 5
          - ring_aligned_with_cylinder:
              _func: object_position_in_zone
              object_cfg: '@pickable'
              reference_cfg: '@destination'
              xy_distance_threshold: 0.04
              consecutive_steps: 5
          - gripper_released:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - left_gripper_contact
              - right_gripper_contact
              force_threshold: 0.01
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: place @pickable.name onto @destination.name
    planner_skills_component:
      skills:
      - type: place
        params:
          object_name: '@pickable'
          target:
            strategy: destination_center
            object_name: '@destination'
      - type: stay
