include: x2real/task/generalization/atom_bottle_on_plate/stages/_atom_bottle_on_plate_stage_base.yaml
direct_task_generator:
  definition:
    task_type: atom_bottle_on_plate_place_bottle
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - bottle_in_zone:
              _func: object_position_in_zone
              object_cfg: '@pickable'
              reference_cfg: '@destination'
              reference_footprint_zone: true
              xy_inset_ratio: 0.15
              z_range:
              - 0.0
              - 0.22
              velocity_threshold: 0.05
              consecutive_steps: 5
          - bottle_upright:
              _func: object_tilt_in_range
              object_cfg: '@pickable'
              axis: z
              min_dot: 0.9
              max_dot: 1.0
              velocity_threshold: 0.05
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: put @pickable.name on @destination.name
        bottle_on_plate_zone:
          trigger: enter
          func: object_position_in_zone
          params:
            object_cfg: '@pickable'
            reference_cfg: '@destination'
            reference_footprint_zone: true
            xy_inset_ratio: 0.15
            z_range:
            - 0.0
            - 0.22
            velocity_threshold: 0.05
            consecutive_steps: 1
            log_prefix: bottle_on_plate
            log_interval: 0
          update_mode: max
