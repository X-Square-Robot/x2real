include: x2real/task/generalization/atom_bottle_on_plate/stages/_atom_bottle_on_plate_stage_base.yaml
direct_task_generator:
  definition:
    task_type: atom_bottle_on_plate_return
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - arm_home:
              _func: articulation_joints_near_default
              asset_cfg: robot
              atol: 0.4
              consecutive_steps: 10
              exclude_joint_name_substrings:
              - finger
              - gripper
              - knuckle
          - bottle_upright:
              _func: object_tilt_in_range
              object_cfg: '@pickable'
              axis: z
              min_dot: 0.98
              max_dot: 1.0
              velocity_threshold: 0.05
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: return to home
