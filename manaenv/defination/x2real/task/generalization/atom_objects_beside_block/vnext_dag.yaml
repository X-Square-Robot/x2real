    score: 4
    include: x2real/task/generalization/atom_objects_beside_block/stages/pick_object.yaml
  - id: place_object
    score: 5
    include: x2real/task/generalization/atom_objects_beside_block/stages/place_object.yaml
  - id: return
    score: 1
    include: x2real/task/generalization/atom_objects_beside_block/stages/return.yaml
