include: x2real/task/language_reasoning/specific_position/stages/_specific_position_stage_base.yaml
direct_task_generator:
  definition:
    task_type: specific_position_place_target
  component_sections:
    termination_component:
      terms:
        object_dropped:
          object_cfg: '@target_bus'
          minimum_height: -0.25
          ignore_below: -1.0
        success:
          _func: object_position_in_zone
          object_cfg: '@target_bus'
          reference_cfg: '@container'
          xy_distance_threshold: 0.1
          z_min_offset: -0.06
          z_max_offset: 0.2
          velocity_threshold: 0.5
          consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: put the requested grid object into @container.name
    planner_skills_component:
      skills:
      - type: pick
        params:
          grasp_label_asset: '@target_bus'
          object_name: '@target_bus'
          filter_x_dir:
          - downward
          - 65.0
      - type: place
        params:
          object_name: '@target_bus'
          target:
            strategy: bbox_ratio
            object_name: '@container'
            x_ratio_range:
            - 0.35
            - 0.65
            y_ratio_range:
            - 0.35
            - 0.65
      - type: stay
