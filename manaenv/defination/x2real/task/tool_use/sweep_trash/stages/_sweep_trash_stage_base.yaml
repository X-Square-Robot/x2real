direct_task_generator:
  definition:
    gen_method: 0
    episode_length_s: 180.0
    num_episodes: 10
    max_steps_per_episode: 1200
  component_sections:
    termination_component:
      terms:
        mdp.time_out:
          time_out: true
        object_dropped:
          object_cfg: '@pickable'
          minimum_height: -0.25
          ignore_below: -1.0
    event_component:
      terms:
        mdp.reset_scene_to_default:
          mode: reset
          reset_joint_targets: true
    metric_component:
      terms:
        success_rate: {}
    viewer_component:
      terms:
        look_at_position:
          lookat_position:
          - 0.204651
          - -0.268246
          - -0.240423
          offset:
          - -1.0
          - 0.0
          - 1.5
    scene_constraint_component:
      constraints:
      - mode: 0
        tags: sweep_trash_scene
    sensor_component:
      sensors:
      - dustpan_contact_sensor_1:
          type: contact
          source: '@pickable_1'
          against: '@container'
