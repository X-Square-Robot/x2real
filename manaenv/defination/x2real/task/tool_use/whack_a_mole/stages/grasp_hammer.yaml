include: x2real/task/tool_use/whack_a_mole/stages/_whack_a_mole_stage_base.yaml
direct_task_generator:
  definition:
    task_type: whack_a_mole_grasp_hammer
  component_sections:
    termination_component:
      terms:
        success:
          mode: or
          terms:
          - grasp_left:
              _func: grasp_left_1
              object_cfg: '@hammer'
              force_threshold: 0.1
              lifted_z_min: -0.2
              consecutive_steps: 5
          - grasp_right:
              _func: grasp_right_1
              object_cfg: '@hammer'
              force_threshold: 0.1
              lifted_z_min: -0.2
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: grasp @hammer.name with either hand
