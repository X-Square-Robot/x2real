include: x2real/task/visual_reasoning/alphabet_word/stages/_alphabet_word_stage_base.yaml
direct_task_generator:
  definition:
    task_type: alphabet_word_return
  component_sections:
    termination_component:
      terms:
        success:
          _func: alphabet_word_and_joints_near_default
          asset_cfg: robot
          atol: 0.4
          slot_tolerance_x: 0.064
          slot_tolerance_y: 0.061
          yaw_target_deg: 180.0
          yaw_tolerance_deg: 30.0
          velocity_threshold: 0.2
          strict: true
          consecutive_steps: 10
    log_component:
      entries:
        progress:
          trigger: success
          value: return home with the complete target word and no distractors in its slots
