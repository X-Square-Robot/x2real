graph_task_generator:
  definition:
    task_type: alphabet_word_spelling_3
    component_sections:
      event_component:
        terms:
          sample_alphabet_word:
            mode: reset
            word_bank:
            - cat
            - dog
            - pen
            - sun
            - cup
            - bed
            - map
            - leg
            - ice
            - fly
            - hit
            - win
            - run
            - eat
            - sit
            - red
            - top
            - lot
            - key
            - box
            letters_log_key: target_word_letters
            word_log_key: target_word
            instruction_template: Select the correct blocks to spell {word}, then
              return the arm home.
            block_prefix: block_alphabet_
            slot_marker_prefix: alphabet_word_slot_
            slot_marker_count: 6
            slot_marker_center:
            - 0.02
            - -0.268
            - -0.235423
            slot_marker_spacing: 0.14
            region:
              x:
              - 0.1
              - 0.32
              y:
              - -0.6
              - 0.08
              z:
              - -0.15
              - -0.15
            distractor_count: 5
            min_separation: 0.11
            block_yaw: 3.141592653589793
      log_component:
        entries:
          target_word:
            trigger: enter
            func: alphabet_active_word
          target_word_letters_episode:
            trigger: enter
            func: alphabet_active_word_letters
      instruction_component:
        topic: alphabet_spelling
      overlay_component:
        evaluation: true
        entries:
        - log_key: target_word
          label: Target word
          font_size: 24
  nodes:
  - id: place_letter_1
    include: x2real/task/visual_reasoning/alphabet_word/stages/place_letter_1.yaml
    score: 1
  - id: place_letter_2
    include: x2real/task/visual_reasoning/alphabet_word/stages/place_letter_2.yaml
    score: 3
  - id: place_letter_3
    include: x2real/task/visual_reasoning/alphabet_word/stages/place_letter_3.yaml
    score: 5
  - id: return
    include: x2real/task/visual_reasoning/alphabet_word/stages/return.yaml
    score: 1
  edges:
  - src: place_letter_1
    dst: place_letter_2
  - src: place_letter_2
    dst: place_letter_3
  - src: place_letter_3
    dst: return
