direct_task_generator:
  definition:
    gen_method: 0
    episode_length_s: 180.0
    num_episodes: 10
    max_steps_per_episode: 5400
  roles:
    balance: balance
    weight: weight
  component_sections:
    termination_component:
      terms:
        mdp.time_out:
          time_out: true
        object_dropped:
          object_cfg: '@weight'
          minimum_height: -0.35
          ignore_below: -5.0
    event_component:
      terms:
        mdp.reset_scene_to_default:
          mode: reset
          reset_joint_targets: true
    metric_component:
      terms:
        success_rate: {}
        object_moved_rate:
          object_cfg: '@weight'
    viewer_component:
      terms:
        look_at_position:
          lookat_position:
          - 0.2
          - -0.27
          - -0.1
          offset:
          - -1.0
          - 0.0
          - 1.2
    scene_constraint_component:
      constraints:
      - mode: 0
        tags: balance_scale_scene
