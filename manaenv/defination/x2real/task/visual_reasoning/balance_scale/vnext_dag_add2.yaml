graph_task_generator:
  definition:
    task_type: balance_scale_add2
    component_sections:
      event_component:
        terms:
          sample_balance_problem:
            mode: reset
            denoms:
            - 50
            - 100
            - 200
            count_per_denom: 2
            add_count: 2
            final_total_cap: 4
            problem_limit:
            - 0
            - 10
            same_target_pan: true
            empty_target_denoms: true
            weight_prefix: weight_
            weight_orientation:
            - 0.0
            - 0.0
            - 0.0
            - 1.0
            left_pan_pos:
            - 0.2
            - -0.179
            - -0.06
            right_pan_pos:
            - 0.2
            - -0.361
            - -0.06
            pan_slot_spacing: 0.045
            pile_region:
              x:
              - -0.05
              - 0.08
              y:
              - -0.35
              - -0.19
              z:
              - -0.2
              - -0.2
            distractor_count: 2
            unique_solution: true
            min_separation: 0.05
            denom_log_key: balance_add_denom
            pan_log_key: balance_add_pan
            instruction_template: Add weights from the pile to balance the two-pan
              scale, then return the arm home.
            detailed_instruction_template: 'Add weights from the pile to balance the
              scale: {plan}. Then return the arm home.'
      log_component:
        entries:
          balance_plan:
            trigger: enter
            func: balance_active_plan
      instruction_component:
        instruction: Add weights from the pile to balance the two-pan scale, then
          return the arm home.
        topic: balance_scale
      overlay_component:
        evaluation: true
        entries:
        - log_key: balance_plan
          label: Add plan
          font_size: 24
  nodes:
  - id: place_weight_1
    include: x2real/task/visual_reasoning/balance_scale/stages/place_weight_1.yaml
    score: 4
  - id: place_weight_2
    include: x2real/task/visual_reasoning/balance_scale/stages/place_weight_2.yaml
    score: 4
  - id: settle
    include: x2real/task/visual_reasoning/balance_scale/stages/settle.yaml
    score: 1
  - id: return
    include: x2real/task/visual_reasoning/balance_scale/stages/return.yaml
    score: 1
  edges:
  - src: place_weight_1
    dst: place_weight_2
  - src: place_weight_2
    dst: settle
  - src: settle
    dst: return
