include: x2real/task/visual_reasoning/image_puzzle/stages/_image_puzzle_stage_base.yaml
direct_task_generator:
  definition:
    task_type: image_puzzle_assemble
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - a_on_paper:
              _func: object_position_in_zone
              object_cfg: '@puzzle_piece_a'
              x_range:
              - 0.15
              - 0.26
              y_range:
              - -0.36
              - -0.18
              velocity_threshold: 0.2
              consecutive_steps: 5
          - b_on_paper:
              _func: object_position_in_zone
              object_cfg: '@puzzle_piece_b'
              x_range:
              - 0.15
              - 0.26
              y_range:
              - -0.36
              - -0.18
              velocity_threshold: 0.2
              consecutive_steps: 5
          - a_yaw_180:
              _func: object_yaw_in_range
              object_cfg: '@puzzle_piece_a'
              min_yaw_deg: 150.0
              max_yaw_deg: 180.0
              velocity_threshold: 0.2
              consecutive_steps: 5
          - b_yaw_180:
              _func: object_yaw_in_range
              object_cfg: '@puzzle_piece_b'
              min_yaw_deg: 150.0
              max_yaw_deg: 180.0
              velocity_threshold: 0.2
              consecutive_steps: 5
          - a_left_of_b_close:
              _func: object_position_in_zone
              object_cfg: '@puzzle_piece_b'
              reference_cfg: '@puzzle_piece_a'
              x_range:
              - -0.05
              - 0.05
              y_range:
              - -0.14
              - -0.04
              xy_distance_threshold: 0.08
              velocity_threshold: 0.2
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: adjust @puzzle_piece_a.name and @puzzle_piece_b.name to form one complete image
