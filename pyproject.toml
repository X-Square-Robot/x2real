[project]
name = "manaenv"
version = "0.9.0"
description = "ManaEnv public evaluation and manual demonstration collection for Isaac Sim and IsaacLab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Isaac Sim 6.0.1.0 remains an external pip prerequisite; install.sh prepares
# the Newton, IsaacLab, and Arena publication sources. Keep this list limited
# to packages imported directly by ManaEnv's evaluation, manual collection, and policy transport
# surfaces.
dependencies = [
    "h5py>=3.11",
    "msgpack>=1.1.2",
    "msgpack-numpy>=0.4.8",
    "numpy>=2,<3",
    "opencv-python>=4.11.0.86",
    "policy-space-protocol==0.3.0",
    "pyyaml>=6",
    "scipy>=1.15.3",
    "websocket-client>=1.9.0",
    "websockets>=14,<17",
]

[project.optional-dependencies]
teleop-vr = ["vuer>=0.1,<0.2"]

[project.scripts]
manaenv-x2real = "manaenv.scripts.x2real_eval:main"
manaenv-x2real-collect = "manaenv.scripts.x2real_collect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manaenv"]

[tool.hatch.build.targets.wheel.force-include]
# Runtime assets are distributed separately. Keep only the bundle contract in
# the wheel so a developer's local 2+ GB asset tree cannot enter a build.
"assets/README.md" = "assets/README.md"
"assets/manifest.json" = "assets/manifest.json"

[tool.isort]
py_version = 312
line_length = 120
profile = "black"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
